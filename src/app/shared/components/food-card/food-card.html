<ion-card [class.sold-out]="!item().available" [class.selected]="quantity() > 0">
  <div class="thumb">
    @if (!imageFailed()) {
      <img
        [src]="item().image"
        [alt]="item().name"
        loading="lazy"
        (error)="imageFailed.set(true)" />
    } @else {
      <span class="emoji" role="img" [attr.aria-label]="item().name">{{ item().emoji }}</span>
    }
    <!-- Status is a word, never colour on its own. -->
    @if (!item().available) {
      <span class="sold-out-tag">Sold out</span>
    }
  </div>

  <ion-card-content>
    <span class="category">{{ item().category }}</span>
    <h2>{{ item().name }}</h2>

    <div class="meta">
      <span>
        <ion-icon name="star" class="star" aria-hidden="true" />
        <span class="sr-only">Rated</span> {{ item().rating | number: '1.1-1' }}
      </span>
      <span>
        <ion-icon name="time-outline" aria-hidden="true" />
        {{ item().prepMinutes }} min
      </span>
    </div>

    <div class="buy">
      <span class="price">{{ item().price | currency: 'PHP' : 'symbol-narrow' }}</span>

      <!-- Starts at 0: a dish is only in the order once you tap +. -->
      <div class="stepper" role="group" [attr.aria-label]="'Quantity of ' + item().name">
        <button
          type="button"
          [disabled]="quantity() <= 0"
          [attr.aria-label]="'Remove one ' + item().name"
          (click)="step(-1)">
          <ion-icon name="remove" aria-hidden="true" />
        </button>
        <span class="qty" aria-live="polite">{{ quantity() }}</span>
        <button
          type="button"
          [disabled]="!item().available || quantity() >= max"
          [attr.aria-label]="'Add one ' + item().name"
          (click)="step(1)">
          <ion-icon name="add" aria-hidden="true" />
        </button>
      </div>
    </div>
  </ion-card-content>
</ion-card>
