  <!--
    Splash screen. Inline so it paints on the very first frame, before the
    app bundle loads; main.ts fades it out once Angular has started.
  -->
  <style>
    #ce-splash {
      position: fixed;
      inset: 0;
      z-index: 100000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      color: #fff;
      font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background:
        radial-gradient(circle at 0 0, rgba(206, 94, 38, 0.4) 0 15%, transparent 15.2%),
        radial-gradient(circle at 0 0, rgba(190, 82, 30, 0.18) 0 27%, transparent 27.2%),
        radial-gradient(circle at 100% 100%, rgba(206, 94, 38, 0.38) 0 13%, transparent 13.2%),
        radial-gradient(circle at 100% 100%, rgba(190, 82, 30, 0.16) 0 25%, transparent 25.2%),
        linear-gradient(165deg, #a0421a 0%, #85310f 55%, #772b0d 100%);
      transition: opacity 0.4s ease, visibility 0.4s;
    }
    #ce-splash.ce-splash--out { opacity: 0; visibility: hidden; }
    .ce-splash-seen #ce-splash { display: none; }

    .ce-splash__icon {
      width: min(30vw, 140px);
      aspect-ratio: 1;
      border-radius: 24%;
      background: linear-gradient(160deg, #cf5a20, #a8461a);
      border: 1px solid rgba(255, 160, 110, 0.45);
      box-shadow: 0 0 48px rgba(255, 120, 55, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }
    .ce-splash__icon svg { display: block; width: 100%; height: 100%; }

    .ce-splash__wordmark { width: min(62vw, 300px); margin-top: 24px; }
    .ce-splash__wordmark svg { display: block; width: 100%; height: auto; }

    .ce-splash__spinner { position: relative; width: 52px; height: 52px; margin-top: 64px; }
    .ce-splash__spinner i {
      position: absolute;
      left: 50%;
      top: 0;
      width: 5px;
      height: 14px;
      margin-left: -2.5px;
      border-radius: 3px;
      background: #f5916a;
      transform-origin: 2.5px 26px;
      transform: rotate(calc(var(--i) * 30deg));
      animation: ce-splash-fade 1s linear infinite;
      animation-delay: calc(var(--i) * 0.0833s - 1s);
    }
    @keyframes ce-splash-fade { from { opacity: 1; } to { opacity: 0.2; } }

    .ce-splash__label { margin: 20px 0 0; max-width: 280px; font-size: 15px; letter-spacing: 0.02em; text-align: center; opacity: 0.88; }

    @media (prefers-reduced-motion: reduce) {
      .ce-splash__spinner i { animation-duration: 2.4s; }
      #ce-splash { transition: none; }
    }
  </style>
  <script>
    // Splash only on the first open: a refresh in the same session skips it.
    // Runs before <body> paints, so the splash never flashes on a refresh.
    try {
      if (sessionStorage.getItem('campuseats.splashSeen')) {
        document.documentElement.classList.add('ce-splash-seen');
      }
    } catch { /* storage unavailable: show the splash */ }
  </script>
