services:
  - type: web
    name: campuseats-frontend
    runtime: static
    rootDir: .
    plan: free
    buildCommand: >-
      sed -i "s#REPLACE-WITH-YOUR-BACKEND.onrender.com#${API_URL}#"
      src/environments/environment.prod.ts &&
      npm install && npm run build
    staticPublishPath: ./www
    envVars:
      - key: API_URL
        sync: false
    # Single-page app: every route (e.g. /tabs/orders) is served index.html,
    # so refreshing or opening a deep link does not 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
